<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMB STI</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background-image: linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
            url("backgroundd.jpeg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /*NAVBAR*/
        .navbar{
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            padding: 0 60px;
            
            
            /*transparan*/
            background: rgba(255,255,255,0.75);

            /*efek kaca*/
            backdrop-filter: blur(8px);

            border-bottom: 1px solid rgba(255,255,255,0.4);
        }

        /*LOGO*/
        .logo{
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo img{
            width: 50px;
            height: 50px;
            object-fit: contain;
        }
        .logo-text{
            display: flex;
            flex-direction: column;
            line-height: 1.2;
            color: #1769d1;
            font-size: 14px;
        }
        .logo-text strong{
            font-size: 15px;
        }

        /*MENU*/
        .menu{
            display: flex;
            align-items: center;
            gap: 35px;
            list-style: none;
            margin-left: 120px;
        }

        .menu a{
            text-decoration: none;
            color: #333;
            font-size: 15px;
            font-weight: 500;
        }

        .menu a:hover{
            color: #1769d1;
        }

        /*DROPDOWN*/
        .dropdown{
            position: relative;
        }

        .dropdown-menu{
            display: none;
            position: absolute;
            top: 30px;
            left: 0;
            min-width: 180px;
            background-color: white;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            border-radius: 8px;
            padding: 10px 0;
            list-style: none;
            z-index: 10;
        }

        .dropdown-menu li a{
            display: block;
            padding: 10px 18px;
            color: #333;
        }

        .dropdown-menu li a:hover{
            background-color: #f1f6ff;
            color: #1769d1;
        }

        /*TAMPILKAN DROPDOWN SAAT DI-HOVER*/
        .dropdown:hover .dropdown-menu{
            display: block;
        }

        /*HERO*/
        .hero{
            min-height: calc(100vh - 80px);

            display: flex;
            align-items: center;
            padding: 0 80px;
            color: white;
        }

        .hero-content{
            max-width: 600px;
            padding: 20px;
            text-align: left;
        }

        .hero-content h1{
            font-size: 46px;
            font-weight: 700;
            line-height: 1.15;
            margin-bottom: 18px;

            text-shadow: 0 3px 10px rgba(0,0,0,0.5);
        }

        .hero-content p{
            font-size: 20px;
            line-height: 1.5;
            margin-bottom: 30px;

            text-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }

        /*TOMBOL DAFTAR*/
        .btn-daftar{
            display: inline-block;

            padding: 14px 35px;
            background-color: #1769d1;
            color: white;

            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-daftar:hover{
            background-color: #0d4fa8;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="logo.png" alt="Logo STI">
        <div class="logo-text">
            <span>Sistem dan</span>
            <strong>Teknologi Informasi</strong>
        </div>
        </div>
        
        <ul class="menu">
            <li>
                <a href="#">Beranda</a>
            </li>

             <li>
                <a href="#">Profil</a>
            </li>

             <li class="dropdown">
                <a href="#">Akademik ▾</a>

                <ul class="dropdown-menu">
                    <li><a href="#">Kurikulum</a></li>
                    <li><a href="#">Dosen</a></li>
                    <li><a href="#">Mata Kuliah</a></li>
                    <li><a href="#">Fasilitas</a></li>
                </ul>
            </li>

            <li>
                <a href="#">Kemahasiswaan</a>
            </li>
            <li><a href="#">Kontak</a></li>
            
        </ul>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h1>
                Sistem dan<br>
                Teknologi Informasi
            </h1>
            <p>Ayo Bersama-sama Menjadi Bagian dari Generasi yang Inovatif, Adaptif, dan Kompeten.</p>
            <a href="#" class="btn-daftar">Daftar</a>
        </div>
    </section>
</body>
</html>
